[package]
name = "nika"
version = "1.1.0"
description = "Proxy Tor na bandeja do Windows"
authors = ["Filipe Vieira"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nika_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "process",
  "fs",
] }

# Usado apenas para a verificação de IP de saída sob demanda (RF-15), sempre
# através do próprio SOCKS5 do Tor. Nenhuma outra chamada de rede sai do app.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "socks",
  "rustls-tls",
] }

# Impressão digital do shim do Discord: uma `version.dll` numa pasta do Discord
# só conta como nossa se o SHA-256 bater com o do shim empacotado (docs/discord-dll.md §6).
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  # `CreateJobObjectW` recebe SECURITY_ATTRIBUTES, que mora aqui.
  "Win32_Security",
  # Snapshot de processos, para achar e fechar o Discord (RF-28/29).
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
# Descoberta das pastas do Discord: só HKCU, porque o Discord instala por
# usuário — é o que mantém a promessa de "sem admin" (RF-27).
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
