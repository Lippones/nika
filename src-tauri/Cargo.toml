[package]
name = "nika"
version = "1.1.0"
description = "Saída do Discord por túnel entre amigos, na bandeja do Windows"
authors = ["Filipe Vieira"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nika_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
] }

# Saída própria para o Discord (docs/discord-tunnel.md): o protocolo WireGuard
# em espaço de usuário. Sem a feature `device` — o Nika não cria adaptador, só
# encapsula pacotes que o WinDivert lhe entrega.
boringtun = { version = "0.7", default-features = false }
# Chaves do perfil `.conf` (base64).
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Túnel (docs/discord-tunnel.md): dono de uma porta (GetExtended*Table), nome
# do processo, `ShellExecuteW` para relançar elevado, token para saber se já
# somos admin, `LoadLibrary` do WinDivert.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
