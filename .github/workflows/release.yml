name: release

# Uma tag v* é o gatilho: o build de release nasce só do que está versionado.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run icons

      # Reproduz o bundle fixado em scripts/tor-bundle.lock.json; qualquer byte
      # diferente aborta o release.
      - run: pwsh scripts/fetch-tor.ps1
      - run: pwsh scripts/build-shim.ps1

      - run: npm run app:build

      - name: Reunir artefatos
        id: artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          if (-not $installer) { throw "instalador não encontrado" }

          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item $installer.FullName dist-release/
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "dist-release/$($installer.Name).sha256"

          "installer=dist-release/$($installer.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "instalador: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
          Write-Host "sha256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: nika-windows
          path: dist-release/

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # Reexecutar a mesma tag reaproveita o release em vez de falhar.
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title $tag --generate-notes --verify-tag
          }
          gh release upload $tag (Get-ChildItem dist-release/*) --clobber
